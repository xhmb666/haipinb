<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 · 公告中心</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 登录界面（未鉴权时显示） -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="logo-badge">hp</div>
      <h1>后台管理</h1>
      <p>请输入管理密码以继续</p>
      <form id="loginForm">
        <div class="form-group">
          <input type="password" name="password" placeholder="请输入密码" autocomplete="off" required />
        </div>
        <div class="captcha-row">
          <div class="form-group">
            <input type="text" name="captcha" placeholder="验证码" autocomplete="off" maxlength="4" required />
          </div>
          <canvas id="captchaCanvas" class="captcha-canvas" width="120" height="48" title="点击刷新"></canvas>
        </div>
        <p class="captcha-tip">看不清？点击图片刷新</p>
        <div class="checkbox-row" style="justify-content:center;margin:10px 0;">
          <input type="checkbox" id="togglePwd" />
          <label for="togglePwd" style="color:rgba(255,255,255,0.9);font-size:13px;">显示密码</label>
        </div>
        <button type="submit" class="btn btn-primary">进入后台</button>
        <div class="login-error" id="loginError"></div>
      </form>
      <div style="text-align:center;margin-top:16px;">
        <button type="button" id="quickLogin" onclick="sessionStorage.setItem('sw_admin_auth','1');location.reload();" style="background:none;border:none;color:rgba(255,255,255,0.9);font-size:14px;text-decoration:underline;cursor:pointer;">🔑 一键登录（免输密码）</button>
      </div>
      <p style="margin-top:20px;">
        <a href="index.html" style="color:rgba(255,255,255,0.85);">← 返回公告页</a>
      </p>
    </div>
  </div>

  <!-- 后台主体（鉴权后显示） -->
  <div id="adminView" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="index.html" class="menu-btn" aria-label="返回">←</a>
        <div class="logo-badge">hp</div>
        <button type="button" class="menu-btn" id="logoutBtn" onclick="sessionStorage.clear();location.replace('admin.html');" aria-label="退出" title="退出登录" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-on-glass);">⏻</button>
      </div>
    </header>

    <main class="container">
      <div class="admin-header">
        <h1>后台管理</h1>
        <a href="index.html" class="back-link">← 返回公告页</a>
      </div>

      <!-- 发布公告 -->
      <section class="admin-card">
        <h2>发布新公告</h2>
        <form id="announcementForm">
          <div class="form-row">
            <div class="form-group">
              <label>标题</label>
              <input type="text" name="title" placeholder="给所有用户发送公告" required />
            </div>
            <div class="form-group">
              <label>来源</label>
              <input type="text" name="source" placeholder="发布人名称" value="管理员" />
            </div>
          </div>
          <div class="form-group">
            <label>内容</label>
            <textarea name="content" placeholder="输入公告内容，支持换行和链接..." required></textarea>
          </div>
          <div class="form-group">
            <label class="checkbox-row">
              <input type="checkbox" name="pinned" />
              置顶显示
            </label>
          </div>
          <button type="submit" class="btn btn-primary">发布公告</button>
        </form>
      </section>

      <!-- 公告列表 -->
      <section class="admin-card">
        <h2>公告列表</h2>
        <div id="adminList"></div>
        <div class="empty" id="adminEmpty" hidden>
          <div class="empty-icon">📭</div>
          <p>暂无公告</p>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script>
    initParticleBackground();
    initAdminAuth();
  </script>
</body>
</html>
